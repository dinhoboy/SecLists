name: Wordlist Updater - Trickest wordlists updater

on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update lists
        run: ./.bin/trickest-updater.sh

      - name: Commit files if changed
        run: |
          git config --global core.autocrlf false
          git add -A
          
          if git diff --staged --quiet; then
              echo "[+] No files were changed"
          else
              echo "[+] Files were changed! Pushing changed..."
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY
              git config --local user.email "example@github.com"
              git config --local user.name "GitHub Action"
              git commit -m "[Github Action] Automated trickest wordlists update." || exit 0
              git push
          fi
